title: DPEA Softdev Training Docs
description: The DPEA's introductory training for software development students 
theme: just-the-docs

url: https://dpengineering.github.io/softdev-training/
enable_copy_code_button: true


callouts:
  note:
    title: Note
    color: purple
  tip:
    title: Tip
    color: green
  warning:
    title: Warning!
    color: red
logo: "assets/Images/engineeringGear.png"
favicon_ico: "/engineeringGear.ico"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
  # The theme's JS and search index are pages too, and wrapping them in a layout breaks them.
  - scope:
      path: "assets"
      type: pages
    values:
      layout: null






